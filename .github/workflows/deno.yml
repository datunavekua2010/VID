
name: Render Axiom Academy Film

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-mp4:
    name: Render Axiom Academy Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify project files
        run: |
          pwd
          ls -la
          test -f package.json
          test -f package-lock.json
          test -f src/remotion-index.ts

      - name: Install dependencies
        run: npm ci

      - name: List Remotion compositions
        run: npx remotion compositions src/remotion-index.ts

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render animation
        run: npx remotion render src/remotion-index.ts AxiomAd axiom-second-chance.mp4 --codec=h264

      - name: Upload MP4
        uses: actions/upload-artifact@v5
        with:
          name: axiom-second-chance-mp4
          path: axiom-second-chance.mp4
          if-no-files-found: error
          retention-days: 7
```
