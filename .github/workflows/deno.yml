```yaml
name: Render Axiom Academy Film

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-mp4:
    name: Render Axiom Academy Video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify project files
        run: |
          echo "Checking project files..."
          pwd
          ls -la
          test -f package.json || (echo "ERROR: package.json is missing from the repository root" && exit 1)
          test -f package-lock.json || (echo "ERROR: package-lock.json is missing from the repository root" && exit 1)
          test -f src/remotion-index.ts || (echo "ERROR: src/remotion-index.ts was not found" && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Verify Remotion composition
        run: npx remotion compositions src/remotion-index.ts

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render animation
        run: npx remotion render src/remotion-index.ts AxiomAd axiom-second-chance.mp4 --codec=h264

      - name: Verify rendered video
        run: |
          if [ ! -f axiom-second-chance.mp4 ]; then
            echo "ERROR: The MP4 file was not generated."
            exit 1
          fi

          if [ ! -s axiom-second-chance.mp4 ]; then
            echo "ERROR: The MP4 file is empty."
            exit 1
          fi

          ls -lh axiom-second-chance.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v5
        with:
          name: axiom-second-chance-mp4
          path: axiom-second-chance.mp4
          if-no-files-found: error
          retention-days: 7
```
