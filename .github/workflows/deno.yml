name: Render Axiom Academy Film

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-mp4:
    name: Render Axiom Academy Video
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Inspect repository
        run: |
          pwd
          ls -la
          find src -maxdepth 4 -type f | sort

      - name: Install dependencies
        run: npm ci

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: List Remotion compositions
        run: npx remotion compositions src/remotion.ts

      - name: Render animation
        run: npx remotion render src/remotion.ts AxiomAd axiom-second-chance.mp4 --codec=h264 --concurrency=2

      - name: Verify rendered video
        run: |
          test -s axiom-second-chance.mp4
          ls -lh axiom-second-chance.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v5
        with:
          name: axiom-second-chance-mp4
          path: axiom-second-challenge.mp4
          if-no-files-found: error
          retention-days: 7
